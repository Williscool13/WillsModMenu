; MethCook settings - restart the game after editing. Delete a line to use its default.

Style             = hud     ; hud (fixed spot on screen), world (over the lab), or both
ReadySound        = true    ; also play the "meth ready" sound non-spatially, so you hear it anywhere
ShowBatches       = true    ; small number: bags the lab can still make
IngredientMarkers = false   ; markers over ingredient pickups, seen through walls ("CS 1  MU 2")
ToggleKey         = NONE    ; icon on/off (NONE to disable)
StyleKey          = NONE    ; switch hud / world / both until restart (NONE to disable)

; --- Advanced ---
PanelX            = 0.985   ; hud: right edge, fraction of screen width
PanelY            = 0.70    ; hud: vertical centre, fraction of screen height
IconSize          = 56      ; px
WorldHeight       = 150     ; world: cm above the lab
HideInMenus       = true
GroupRadius       = 6       ; ingredient markers: pickups this many metres apart share one marker
IdleColor         = D9D9D9
CookingColor      = 26B3FF
PerfectColor      = 0D40FF
BurntColor        = FF3326
BoomColor         = FF1F1F  ; red X on a destroyed lab
