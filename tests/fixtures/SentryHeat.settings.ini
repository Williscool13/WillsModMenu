; SentryHeat settings. Will's Mod Menu changes them in game; after editing by hand, restart the game. Delete a line to use its default.

Style         = world             ; world (data over each sentry) or panel (number tags + HUD table)
ShowMine      = heat, dmg, kills  ; any of heat, dmg, kills - or off
ShowTeammates = heat              ; same options; shown faded

YellowAt      = 60                ; heat % for yellow (game smoke starts at 80, fire ~98)
RedAt         = 80                ; heat % for red
EdgeWarning   = true              ; red arrow at screen edge when your off-screen sentry hits RedAt

ToggleKey     = NONE              ; markers on/off (NONE to disable)
StyleKey      = NONE              ; switch style until restart (NONE to disable)

; --- Advanced ---
PanelX          = 0.985   ; panel style: right edge, fraction of screen width
PanelY          = 0.58    ; panel style: vertical centre, fraction of screen height
NearDistance    = 15      ; metres: full panel when closer than this (world style)
MarkerHeight    = 25      ; cm above the sentry
TeammateOpacity = 0.75
HideInMenus     = true
CappedColor     = 59A6FF  ; Machine War bonus at its +50% cap
HeatColorLow    = 59FF59
HeatColorMid    = FFD933
HeatColorHigh   = FF4033
